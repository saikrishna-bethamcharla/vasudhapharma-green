; ==============================================================================
; Vasudha Pharma Chem Limited — GoDaddy / cPanel Production PHP Directives
; Ensures large PDF/document uploads and operations work seamlessly
; ==============================================================================

upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
session.gc_maxlifetime = 3600

; Hardened Security Directives (Production)
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
