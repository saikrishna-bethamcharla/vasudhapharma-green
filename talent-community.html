<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Careers | Vasudha Pharma Chem Limited</title>
  <meta http-equiv="refresh" content="0; url=careers.html">
  <link rel="canonical" href="https://vasudhapharma.com/careers.html">
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
    .redirect-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
      max-width: 440px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #006039;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; color: #006039; }
    p { font-size: 14px; color: #64748b; margin: 0 0 20px; line-height: 1.5; }
    a {
      display: inline-block;
      background: #006039;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    a:hover { background: #0e8f6c; }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h1>Careers at Vasudha Pharma</h1>
    <p>Redirecting you to our official careers portal and open opportunities...</p>
    <a href="careers.html">Click here if not redirected &rarr;</a>
  </div>
  <script>window.location.replace("careers.html");</script>
</body>
</html>
